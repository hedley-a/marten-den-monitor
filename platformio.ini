; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Adafruit nRF52 FreeRTOS core 
;   (preferred for advanced multi-tasking low-power applications),
;
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_nrf52840]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
;platform = nordicnrf52
board = seeed-xiao-afruitnrf52-nrf52840
;board = seeed_xiao_nrf52840https://www.linusakesson.net/programming/tty/
framework = arduino
upload_protocol = nrfutil
upload_port = /dev/ttyACM1

lib_deps =
    adafruit/Adafruit SPIFlash @ ^5.0.0
monitor_speed = 115200